name: Model B database security

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .github/workflows/model-b-role-security.yml
      - scripts/ci/model_b*.py
      - scripts/ci/model_b*.exs
      - lib/store/orders/**
      - priv/resource_snapshots/**
      - priv/repo/migrations/**
      - test/store/orders/membership_allocation*.exs

permissions:
  contents: read

jobs:
  role_security:
    name: model_b_role_security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        ports:
          - 55433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: model_b_role_proof
        options: >-
          --health-cmd "pg_isready -U postgres -d model_b_role_proof"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 56380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: setup-beam
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
          key: ${{ runner.os }}-model-b-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-static-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-
      - name: Fetch build dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
      - name: Verify disposable Model B roles under their actual logins
        env:
          PGHOST: 127.0.0.1
          PGPORT: 55433
          PGDATABASE: model_b_role_proof
          PGUSER: postgres
          PGPASSWORD: postgres
          MODEL_B_CI_DISPOSABLE: "true"
        run: python3 scripts/ci/model_b_role_security.py
